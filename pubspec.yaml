name: mini_github
description: "A new Flutter project like a github."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fpdart: ^1.1.1
  dio: ^5.8.0+1
  riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  mocktail: ^1.0.4
  go_router: ^15.1.1
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  skeletonizer: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
  fonts:
    - family: Mona
      fonts:
        - asset: assets/fonts/Mona-Sans.ttf